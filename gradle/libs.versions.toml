# Versions mirrored from a build known to work on this host (Gradle 9.7.1,
# Temurin 25 build JVM, bytecode targeting 17).
[versions]
agp = "9.4.0"
kotlin = "2.4.10"
composeBom = "2026.08.00"
activity = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.18.0"
googleServices = "4.5.0"
firebaseBom = "34.19.0"
credentials = "1.6.0"
googleid = "1.2.0"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
# Versionless: the BOM above pins these.
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3 = { module = "androidx.compose.material3:material3" }
# material3 1.4 no longer pulls the icon set transitively.
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core", version = "1.7.8" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

# Auth. Versionless firebase-auth: the BOM above pins it.
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
# Credential Manager, not the old GoogleSignIn API -- that one is deprecated and
# its Activity-result flow does not fit Compose.
androidx-credentials = { module = "androidx.credentials:credentials", version.ref = "credentials" }
androidx-credentials-play-services = { module = "androidx.credentials:credentials-play-services-auth", version.ref = "credentials" }
google-identity = { module = "com.google.android.libraries.identity.googleid:googleid", version.ref = "googleid" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# Reads google-services.json and generates the Firebase config resources.
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
# Kotlin 2.x moves the Compose compiler out of composeOptions into its own plugin.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
