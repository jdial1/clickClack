# No org.gradle.jvmargs here on purpose. Project-level jvmargs override the
# user-level ones, and this host needs -Djdk.net.unixdomain.tmpdir to start a
# daemon at all. That flag lives in ~/.gradle/gradle.properties; overriding it
# here would break the build on this machine.

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
